<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trova il tuo tavolo</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 10px 20px 20px;
  font-family: Georgia, serif;
  background: #f7f3eb;
}

.container {
  width: 100%;
  max-width: 400px;
  min-height: 85vh;
  min-height: 85dvh;
  background: white;
  padding: 25px 20px;
  border-radius: 18px;
  text-align: center;
  box-shadow: 0 8px 30px #00000012;
  display: flex;
  flex-direction: column;
}

h1 {
  color: red;
  font-size: 32px;
  font-weight: normal;
  margin-bottom: 10px;
}

.subtitle {
  color: #817665;
  margin-bottom: 30px;
}

.foto {
  display: block;
  width: 80%;
  max-width: 300px;
  height: auto;
  object-fit: contain;
  margin: 0 auto;
  border-radius: 12px;
}

input {
  width: 100%;
  padding: 15px;
  border: 1px solid #d8c9ad;
  border-radius: 8px;
  font-size: 16px;
  margin-bottom: 15px;
  text-align: center;
  outline: none;
}

input:focus {
  border-color: #a35454;
}

button {
  width: 100%;
  padding: 15px;
  background: #a38754;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
  font-family: Georgia, serif;
}

button:hover {
  background: #80683f;
}

#risultato {
  margin-top: 10px;
  color: #817665;
}

.tavolo {
  background: #f7f3eb;
  padding: 25px;
  border-radius: 12px;
  color: #a38754;
  font-size: 32px;
  margin: 5px;
}

.errore {
  color: #b33b35;
  font-size: 16px;
}

.footer {
  margin-top: 30px;
  color: #a35454;
  font-size: 13px;
}

.secondario {
  margin-top: 4px;
  background: #816565;
}

</style>

</head>

<body>

<div class="container">

    <div id="paginaIniziale">

  <img
    src="images.jpg"
    class="foto"
    alt="Foto iniziale"
  >

  <h1>Benvenuti alla festa di laurea
  del Dottor Gianluca Ferretti!</h1>

  <p class="subtitle">
    Siamo felici di avervi qui.<br>
    Scopri dove accomodarti.
  </p>

</div>

  <div id="ricercaNome">

    <input
      type="text"
      id="nome"
      placeholder="Inserisci il tuo nome"
      autocomplete="off"
      onkeydown="if(event.key === 'Enter') cercaTavolo()"
    >

    <button onclick="cercaTavolo()">
      Cerca il mio tavolo
    </button>

  </div>

  <div id="risultato"></div>

  <div class="footer">
    Con affetto ❤️
  </div>

</div>


<script>

// ==================================
// LISTA INVITATI
// ==================================

const invitati = [

  // TAVOLO 1
  { nome: "Mario", cognome: "Ferretti", tavolo: "phyton"},
  { nome: "Valentino", cognome: "Ferretti", tavolo: "JavaScript"},
  { nome: "Gianluca", cognome: "Ferretti", tavolo: "HTML"},
  { nome: "Angela", cognome: "Ferretti", tavolo: "php"},
  { nome: "Carla", cognome: "Faricciotti", tavolo: "php"},
  { nome: "Fausto", cognome: "Faricciotti", tavolo: "R"},
  { nome: "Anto", cognome: "Faricciotti", tavolo: "MATLAB"},
  { nome: "Ranieri", cognome: "Faricciotti", tavolo: "java"},

  // TAVOLO 2
  { nome: "Emanuela", cognome: "Di felice", tavolo: "MATLAB"},
  { nome: "Martin", cognome: "Gialli", tavolo: "MATLAB" },
  { nome: "Marina", cognome: "Faricciotti", tavolo: "MATLAB" },
  { nome: "Gianluca", cognome: "Ferretti", tavolo: "MATLAB" },
  { nome: "Valeria", cognome: "Di bacco", tavolo: "MATLAB" },
  { nome: "Francesca", cognome: "Taglieri", tavolo: "MATLAB" },
  { nome: "Martina", cognome: "Faris", tavolo: "MATLAB" },
  

  //TAVOLO 3
  { nome: "Stefano", cognome: "Sincic", tavolo: "sql"},
  { nome: "Alfonso", cognome: "Di loreto", tavolo: "R"},
  { nome: "Donato", cognome: "Di marco", tavolo: "java" },
  { nome: "Anna", cognome: "Bianchi", tavolo: "java" },
  { nome: "Anna", cognome: "Sabbia", tavolo: "java"},
  { nome: "Annamaria", cognome: "Ferretti", tavolo: "C++" },
  { nome: "Anna", cognome: "Gialli", tavolo: "java"}

];


// ===================================
// FOTO ASSOCIATA A OGNI TAVOLO
// ===================================

const fotoTavoli = {

  "java": "java.png",

  "JavaScript": "JavaScript.webp",

  "MATLAB":"MATLAB.jpg",

  "R":"R.png",

  "HTML":"HTML.jpg",

  "php":"php.jpg",

  "sql":"sql.jpg",

  "C++":"C++.png",

  "phyton" : "phyton.png"

  
};


// ==================================
// RICERCA DEL NOME
// ==================================

function cercaTavolo() {

  const inserimento = document
    .getElementById("nome")
    .value.trim().toLowerCase()
    .replace(/\s+/g, " ");

  const risultato = document.getElementById("risultato");

  if (!inserimento) {
    risultato.innerHTML =
      '<p class="errore">Inserisci il tuo nome!</p>';
    return;
  }

  // Cerca direttamente nome e cognome
  const personaCompleta = invitati.find(p =>
    `${p.nome} ${p.cognome}`.toLowerCase() === inserimento
  );

  if (personaCompleta) {
    mostraTavolo(personaCompleta);
    return;
  }

  // Se è stato inserito solo il nome
  const corrispondenze = invitati.filter(p =>
    p.nome.toLowerCase() === inserimento
  );

  if (corrispondenze.length === 0) {

    document.getElementById("ricercaNome").style.display = "none";

    risultato.innerHTML = `
      <h2 class="errore">Ops! Non ti troviamo</h2>
      <p>Il nominativo non risulta nella lista degli invitati.</p>
      <button class="secondario" onclick="riprovaNome()">
        Riprova
      </button>
    `;

    return;
  }

  if (corrispondenze.length === 1) {
    mostraTavolo(corrispondenze[0]);
    return;
  }

  // Se ci sono più persone con lo stesso nome
  document.getElementById("ricercaNome").style.display = "none";

  risultato.innerHTML = `
    <p>Ci sono più persone con questo nome.</p>
    <p>Inserisci il tuo cognome:</p>

    <input
      type="text"
      id="cognome"
      placeholder="Inserisci il cognome"
      autocomplete="off"
      onkeydown="if(event.key === 'Enter') cercaCognome()"
    >

    <button onclick="cercaCognome()">Conferma</button>

    <button class="secondario" onclick="riprovaNome()">
      Torna indietro
    </button>
  `;
}


// ==================================
// RICERCA DEL COGNOME
// ==================================

function cercaCognome() {

  const nome = document
    .getElementById("nome")
    .value.trim().toLowerCase();

  const cognome = document
    .getElementById("cognome")
    .value.trim().toLowerCase();

  const risultato = document.getElementById("risultato");

  if (!cognome) {

    risultato.innerHTML =
      '<p class="errore">Inserisci il tuo cognome!</p>';

    return;
  }

  const persona = invitati.find(p =>
    p.nome.toLowerCase() === nome &&
    p.cognome.toLowerCase() === cognome
  );

  if (persona) {

    mostraTavolo(persona);

  } else {

    risultato.innerHTML = `
      <p class="errore">
        Cognome non trovato.<br>
        Controlla e riprova!
      </p>

      <button onclick="cercaTavolo()">
        Riprova
      </button>
    `;

  }

}


// ==================================
// MOSTRA TAVOLO E FOTOGRAFIA
// ===================================

function mostraTavolo(persona) {

  const foto = fotoTavoli[persona.tavolo];

  // Nasconde tutta la schermata iniziale
  document.getElementById("paginaIniziale")
    .style.display = "none";

  // Nasconde anche la ricerca
  document.getElementById("ricercaNome")
    .style.display = "none";

  // Mostra il risultato
  document.getElementById("risultato").innerHTML = `

    <h1>Complimenti ${persona.nome}!</h1>

    <p>Il tuo tavolo è:</p>

    <div class="tavolo">
      TAVOLO ${persona.tavolo}
    </div>

    ${foto ? `
      <img
        src="${foto}"
        class="foto"
        alt="Foto del tavolo ${persona.tavolo}"
        onerror="this.style.display='none'"
      >
    ` : ""}

    <p>Buon divertimento!</p>

    <button class="secondario" onclick="ricomincia()">
      Nuova ricerca
    </button>

  `;
}

// ==================================
// RICOMINCIA LA RICERCA
// ==================================

function ricomincia() {

  document.getElementById("nome").value = "";

  document.getElementById("paginaIniziale")
    .style.display = "block";

  document.getElementById("ricercaNome")
    .style.display = "block";

  document.getElementById("risultato").innerHTML = "";

}


function riprovaNome() {

  document.getElementById("nome").value = "";

  document.getElementById("risultato").innerHTML = "";

  document.getElementById("paginaIniziale").style.display = "block";

  document.getElementById("ricercaNome").style.display = "block";

  document.getElementById("nome").focus();

}



</script>

</body>
</html>
